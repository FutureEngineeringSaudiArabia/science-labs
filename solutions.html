<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>معمل المحاليل والتركيز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f2328; --muted:#5d6570; --line:#d9d4c9;
  --stage:#e8eef2; --accent:#0f6e8c; --accent-soft:#dcedf3; --warm:#c2410c; --warm-soft:#fde9dc;
  --ok:#1f7a4d; --ok-soft:#dff1e7; --bad:#b42318; --bad-soft:#fbe4e1;
  --acid:#d1344a; --base:#2b5fd9; --neutral:#2f9e5a; --water:#7fb8e6; --glass:#c9d6de;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --stage:#1a242c; --accent:#5cc0e0; --accent-soft:#16323d; --warm:#ff8a4c; --warm-soft:#3b2116;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --acid:#ff6b7f; --base:#7aa2ff; --neutral:#5fd39a; --water:#3d6f99; --glass:#4a5863; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --stage:#1a242c; --accent:#5cc0e0; --accent-soft:#16323d; --warm:#ff8a4c; --warm-soft:#3b2116;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --acid:#ff6b7f; --base:#7aa2ff; --neutral:#5fd39a; --water:#3d6f99; --glass:#4a5863; color-scheme:dark}
html{direction:rtl}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.wrap>header{display:flex;flex-direction:column;gap:4px;padding-inline-end:110px}
.eyebrow{font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0;text-wrap:balance}
.steps{display:flex;gap:6px;list-style:none;margin:6px 0 0;padding:0}
.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps li.done{background:var(--accent)}
.steps li.now{background:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.card h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.card p{margin:0;max-width:68ch}
.muted{color:var(--muted);font-size:14px}
.stage{background:var(--stage);border-radius:10px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:right;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;background:var(--warm);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;align-self:flex-start}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--accent-soft);color:var(--ink)}
.done-card{border:2px solid var(--ok)}
.code{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.15em;direction:ltr;text-align:center;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px;font-variant-numeric:tabular-nums}
ul.learned{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--warm);background:var(--warm-soft)}
.chip.placed{opacity:.35;cursor:default}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{font:inherit;text-align:right;background:var(--bg);color:var(--ink);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:96px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bin b{font-family:var(--display);font-weight:500;font-size:15px}
.bin .in{display:flex;flex-wrap:wrap;gap:4px}
.bin .in span{font-size:13px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:2px 10px}
.bin.ready{border-color:var(--warm)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-weight:600;color:var(--muted);font-size:13px}
td.empty{color:var(--muted)}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.slider output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--warm)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.seg button{font:inherit;font-size:15px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;cursor:pointer;line-height:1.35}
.seg button small{display:block;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--warm);background:var(--warm-soft)}
.seg button.tried{border-style:solid}
.seg button.tried::after{content:" ✓";color:var(--ok);font-size:12px}
.order{display:grid;gap:6px;counter-reset:n;padding:0;margin:0;list-style:none}
.order li{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;counter-increment:n}
.order li::before{content:counter(n) ". ";font-weight:700}
.order li.slot{background:var(--bg);color:var(--muted);border:1.5px dashed var(--line)}
.order li.slot::before{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}


</style>
<div class="wrap">
<header><span class="eyebrow">معمل افتراضي · ثاني متوسط · المخاليط والمحاليل</span><h1>المحاليل والتركيز</h1><ul class="steps" id="steps" aria-hidden="true"></ul></header>
<main id="main" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<style>
.fxglow{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}
.fxglow.ok{box-shadow:inset 0 0 0 6px #2fbf71,inset 0 0 90px 30px rgba(47,191,113,.55);animation:fxg 1s ease-out}
.fxglow.no{box-shadow:inset 0 0 0 6px #e5484d,inset 0 0 90px 30px rgba(229,72,77,.45);animation:fxg .8s ease-out}
@keyframes fxg{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.fxbadge{position:fixed;left:50%;top:40%;z-index:31;pointer-events:none;font-family:var(--display);font-weight:700;font-size:42px;color:#fff;background:#1f9d5c;padding:8px 30px;border-radius:999px;opacity:0;transform:translate(-50%,-50%) scale(.6)}
.fxbadge.show{animation:fxb 1.1s ease-out}
@keyframes fxb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.fxbadge.show{animation:none;opacity:0}.fxglow.ok,.fxglow.no{animation-duration:.01s}}
.wrap>header{padding-inline-end:110px}
.sndbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:20;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.sndbtn:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
</style>
<button class="sndbtn" id="sndbtn" aria-pressed="true">الصوت: يعمل</button>
<script>
const SFX=(()=>{
  let ac=null,on=true;
  const btn=document.getElementById("sndbtn");
  btn.onclick=()=>{on=!on;btn.setAttribute("aria-pressed",on);btn.textContent=on?"الصوت: يعمل":"الصوت: متوقف";};
  const A=()=>{if(!on)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}};
  function tone(f,t0,d,type,vol,f2){const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.2,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}
  function noise(t0,d,vol,fType,fFreq,fEnd){const c=A();if(!c)return;const n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=fType||"lowpass";f.frequency.setValueAtTime(fFreq||800,c.currentTime+t0);if(fEnd)f.frequency.exponentialRampToValueAtTime(fEnd,c.currentTime+t0+d);const g=c.createGain();g.gain.setValueAtTime(vol||.3,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+t0)}
  const fx=document.createElement("div");fx.className="fxglow";fx.setAttribute("aria-hidden","true");document.body.append(fx);
  const badge=document.createElement("div");badge.className="fxbadge";badge.setAttribute("aria-hidden","true");badge.textContent="ممتاز";document.body.append(badge);
  function glow(kind){fx.className="fxglow";badge.className="fxbadge";void fx.offsetWidth;fx.className="fxglow "+kind;if(kind==="ok"){void badge.offsetWidth;badge.className="fxbadge show"}}
  const ding=()=>{tone(1318,0,.7,"sine",.22);tone(2637,0,.35,"sine",.06)};
  const buzz=()=>{tone(150,0,.28,"square",.07,120)};
  return{
    good(){glow("ok");ding()},
    bad(){glow("no");buzz()},
    win(){glow("ok");ding();setTimeout(()=>tone(1568,0,.8,"sine",.2),220)},
    tick(){tone(880,0,.08,"sine",.1)},
    rumble(d,vol){noise(0,d||2,vol||.5,"lowpass",140,60)},
    boom(){noise(0,2.5,1,"lowpass",900,40);tone(70,0,1.4,"sine",.6,30)},
    bubble(){for(let i=0;i<10;i++)tone(300+Math.random()*500,i*.12+Math.random()*.05,.08,"sine",.07,700+Math.random()*400)},
    hiss(d){noise(0,d||1.5,.15,"highpass",3000)},
    whoosh(){noise(0,.6,.25,"bandpass",400,2400)},
    thud(){tone(110,0,.25,"sine",.35,50)},
  };
})();
</script>
<script>
// Shared helpers for all labs
const $=(s,r=document)=>r.querySelector(s);
const el=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.childElementCount===1?t.content.firstElementChild:t.content};
const shuffle=(a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e}

// Step bar
function setSteps(n,total){const ul=$("#steps");ul.replaceChildren();for(let i=0;i<total;i++){const li=document.createElement("li");if(i<n)li.className="done";else if(i===n)li.className="now";ul.append(li)}}

// Multiple-choice: must reach the right answer to continue. Returns promise resolved on correct.
// opts: [{t:"text", ok:true/false, why:"explanation"}]
function mcq(host,{q,opts,right,doShuffle=true}){
  return new Promise(res=>{
    const box=el(`<div class="opts" role="group"></div>`);
    const fb=el(`<div class="fb" role="status" hidden></div>`);
    if(q)host.append(el(`<p><b>${q}</b></p>`));
    host.append(box,fb);
    const list=doShuffle?shuffle(opts):opts;
    let tries=0;
    list.forEach(o=>{
      const b=el(`<button class="opt" type="button">${o.t}</button>`);
      b.onclick=()=>{
        if(o.ok){
          box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          b.classList.add("right");fb.hidden=false;fb.className="fb ok";fb.textContent=right||o.why||"إجابة صحيحة.";SFX.good();res(tries)
        }else{
          tries++;b.classList.add("wrong");b.disabled=true;fb.hidden=false;fb.className="fb no";fb.textContent=o.why||"ليست هذه. فكّري مرة أخرى.";SFX.bad()
        }
      };
      box.append(b);
    });
  });
}

// Tap-to-classify: pick a chip then a bin. items:[{t, bin, why}] bins:[{id,label,hint}]
function classify(host,{items,bins,onPick}){
  return new Promise(res=>{
    const chips=el(`<div class="chips" aria-label="البطاقات"></div>`);
    const binsEl=el(`<div class="bins"></div>`);
    const fb=el(`<div class="fb info" role="status">اختاري بطاقة، ثم اختاري المجموعة المناسبة لها.</div>`);
    host.append(chips,binsEl,fb);
    let sel=null,left=items.length;
    const binBtns={};
    bins.forEach(b=>{
      const bb=el(`<button class="bin" type="button"><b>${b.label}</b>${b.hint?`<span class="muted">${b.hint}</span>`:""}<span class="in"></span></button>`);
      bb.onclick=()=>{
        if(!sel){fb.className="fb info";fb.textContent="اختاري بطاقة أولاً.";return}
        const it=sel.item;
        if(it.bin===b.id){
          bb.querySelector(".in").append(el(`<span>${it.t}</span>`));
          sel.btn.classList.add("placed");sel.btn.disabled=true;sel.btn.setAttribute("aria-pressed","false");
          fb.className="fb ok";fb.textContent=it.why||"صحيح.";SFX.good();sel=null;left--;
          Object.values(binBtns).forEach(x=>x.classList.remove("ready"));
          if(left===0)res();
        }else{
          fb.className="fb no";fb.textContent=it.hintWrong||"ليست هذه المجموعة. انظري إلى المادة مرة أخرى.";SFX.bad();
        }
      };
      binBtns[b.id]=bb;binsEl.append(bb);
    });
    shuffle(items).forEach(it=>{
      const c=el(`<button class="chip" type="button" aria-pressed="false">${it.t}</button>`);
      c.onclick=()=>{
        chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
        c.setAttribute("aria-pressed","true");sel={item:it,btn:c};SFX.tick();
        Object.values(binBtns).forEach(x=>x.classList.add("ready"));
        fb.className="fb info";fb.textContent="«"+it.t+"»: إلى أي مجموعة تنتمي؟";
        if(onPick)onPick(it);
      };
      chips.append(c);
    });
  });
}

// Final screen with code
function finish(task,code,learned){
  SFX.win();
  task.classList.add("done-card");
  task.replaceChildren(el(`<div><h2>أنهيتِ المعمل</h2><p>رمز الإنجاز الخاص بهذا المعمل:</p><div class="code">${code}</div><p>عودي إلى النموذج واكتبي هذا الرمز، ثم أجيبي عن السؤال.</p><h2 style="margin-top:12px">ما تعلمتِه</h2><ul class="learned">${learned.map(x=>`<li>${x}</li>`).join("")}</ul></div>`));
  task.scrollIntoView({behavior:"smooth",block:"start"});
}

</script>
<script>
const CODE="8326";
const main=$("#main");
const TOTAL=4;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- canvas helper ----------
function makeCanvas(w,h,label){
  const c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.style.aspectRatio=w+"/"+h;c.style.width="100%";c.setAttribute("role","img");c.setAttribute("aria-label",label);
  const x=c.getContext("2d");x.scale(2,2);return {c,x,w,h};
}
function beaker(x,bx,by,bw,bh,level,tint){
  // water
  const top=by+bh-level;
  x.fillStyle=tint||"rgba(127,184,230,.35)";x.fillRect(bx+4,top,bw-8,level-4);
  // glass
  x.strokeStyle=css("--ink");x.lineWidth=3;x.beginPath();x.moveTo(bx-6,by);x.lineTo(bx,by+6);x.lineTo(bx,by+bh-8);x.quadraticCurveTo(bx,by+bh,bx+8,by+bh);x.lineTo(bx+bw-8,by+bh);x.quadraticCurveTo(bx+bw,by+bh,bx+bw,by+bh-8);x.lineTo(bx+bw,by+6);x.lineTo(bx+bw+6,by);x.stroke();
  return top;
}

// ================= Stage 1: why water dissolves many things =================
function stage1(){
  setSteps(0,TOTAL);
  const card=el(`<section class="card"><h2>١. لماذا يُسمّى الماء «المذيب العام»؟</h2>
  <p>كبّري جزيء الماء أولاً، ثم أضيفي كل مادة إلى الكأس ولاحظي ما يحدث لجسيماتها.</p>
  <div class="stage" id="s1"></div>
  <div class="row" id="s1btns"></div>
  <div class="tablebox"><table><thead><tr><th>المادة</th><th>ماذا حدث لجسيماتها؟</th><th>هل ذابت؟</th></tr></thead><tbody id="s1t">
  <tr data-k="salt"><td>ملح الطعام</td><td class="empty">—</td><td class="empty">—</td></tr>
  <tr data-k="sugar"><td>السكر</td><td class="empty">—</td><td class="empty">—</td></tr>
  <tr data-k="oil"><td>الزيت</td><td class="empty">—</td><td class="empty">—</td></tr></tbody></table></div>
  <div id="s1q"></div></section>`);
  main.append(card);
  const W=360,H=250;const {c,x}=makeCanvas(W,H,"كأس ماء تظهر فيه الجسيمات");$("#s1",card).append(c);
  const BX=60,BY=30,BW=240,BH=200;
  // water molecules
  const R=()=>Math.random();
  let waters=[];for(let i=0;i<34;i++)waters.push({x:BX+20+R()*(BW-40),y:BY+70+R()*(BH-90),a:R()*6.28,vx:(R()-.5)*.4,vy:(R()-.5)*.4,tx:null,ty:null});
  let parts=[];let mode="zoom";let oilLayer=0;let zoomed=false;
  function drawWater(m,s=1){
    x.save();x.translate(m.x,m.y);x.rotate(m.a);
    x.fillStyle="#e5484d";x.beginPath();x.arc(0,0,6*s,0,7);x.fill();
    x.fillStyle="#f4f4f4";x.strokeStyle="#666";x.lineWidth=.8;
    for(const sg of[-1,1]){x.beginPath();x.arc(7*s*sg,5*s,3.6*s,0,7);x.fill();x.stroke()}
    x.restore();
  }
  function frame(){
    x.clearRect(0,0,W,H);
    if(zoomed===false&&mode==="zoom"){
      // big polar molecule
      x.fillStyle=css("--ink");x.font="600 14px "+css("--body");x.textAlign="center";
      const m={x:W/2,y:H/2-10,a:0};drawWater(m,4.2);
      x.fillStyle=css("--acid");x.font="700 18px "+css("--body");x.fillText("طرف سالب (−)",W/2,H/2-48);
      x.fillStyle=css("--base");x.fillText("(+)",W/2-30,H/2+50);x.fillText("(+)",W/2+30,H/2+50);
      x.fillStyle=css("--ink");x.font="500 14px "+css("--body");x.fillText("طرفان موجبان",W/2,H/2+72);
      x.fillText("جزيء الماء قطبي: له طرف سالب وطرف موجب",W/2,H-14);
      requestAnimationFrame(frame);return;
    }
    const top=beaker(x,BX,BY,BW,BH,BH-50);
    // oil layer
    if(oilLayer>0){x.fillStyle="rgba(234,179,8,.75)";x.fillRect(BX+4,top-oilLayer,BW-8,oilLayer);x.fillStyle=css("--ink");x.font="500 13px "+css("--body");x.textAlign="center";if(oilLayer>14)x.fillText("طبقة زيت",BX+BW/2,top-oilLayer/2+5)}
    for(const m of waters){
      if(m.tx!=null){m.x+=(m.tx-m.x)*.06;m.y+=(m.ty-m.y)*.06;if(m.ta!=null)m.a+=(m.ta-m.a)*.08}
      else{m.x+=m.vx;m.y+=m.vy;m.a+=.01;if(m.x<BX+14||m.x>BX+BW-14)m.vx*=-1;if(m.y<top+10||m.y>BY+BH-14)m.vy*=-1}
      drawWater(m);
    }
    for(const p of parts){
      if(p.tx!=null){p.x+=(p.tx-p.x)*.05;p.y+=(p.ty-p.y)*.05}
      if(p.k==="Na"){x.fillStyle="#8e6cd9";x.beginPath();x.arc(p.x,p.y,8,0,7);x.fill();x.fillStyle="#fff";x.font="700 10px sans-serif";x.textAlign="center";x.fillText("+",p.x,p.y+4)}
      if(p.k==="Cl"){x.fillStyle="#38b26b";x.beginPath();x.arc(p.x,p.y,10,0,7);x.fill();x.fillStyle="#fff";x.font="700 12px sans-serif";x.textAlign="center";x.fillText("−",p.x,p.y+4)}
      if(p.k==="sug"){x.fillStyle="#f5f5f5";x.strokeStyle="#999";x.lineWidth=1;x.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;x.lineTo(p.x+9*Math.cos(a),p.y+9*Math.sin(a))}x.closePath();x.fill();x.stroke()}
      if(p.k==="oil"){x.fillStyle="#eab308";x.beginPath();x.ellipse(p.x,p.y,12,7,0,0,7);x.fill()}
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const btns=$("#s1btns",card);
  const zoomBtn=el(`<button class="btn alt" type="button">انتقلي إلى الكأس</button>`);btns.append(zoomBtn);
  const done=new Set();
  zoomBtn.onclick=()=>{zoomed=true;mode="cup";zoomBtn.remove();SFX.whoosh();
    [["salt","أضيفي ملح الطعام"],["sugar","أضيفي السكر"],["oil","أضيفي الزيت"]].forEach(([k,t])=>{const b=el(`<button class="btn" type="button">${t}</button>`);b.onclick=()=>add(k,b);btns.append(b)})};
  function setRow(k,a,b){const r=$(`tr[data-k="${k}"]`,card);r.children[1].textContent=a;r.children[2].textContent=b;r.children[1].classList.remove("empty");r.children[2].classList.remove("empty")}
  async function add(k,b){
    btns.querySelectorAll("button").forEach(z=>z.disabled=true);
    parts=[];oilLayer=0;waters.forEach(m=>{m.tx=null;m.ta=null});
    if(k==="salt"){
      // crystal drops then ions separate, waters orient around
      const ions=[];for(let i=0;i<4;i++){ions.push({k:"Na",x:BX+BW/2-12+(i%2)*22,y:BY+10+Math.floor(i/2)*20});ions.push({k:"Cl",x:BX+BW/2-1+(i%2)*22,y:BY+10+Math.floor(i/2)*20+10})}
      parts=ions;SFX.thud();
      parts.forEach(p=>{p.tx=p.x;p.ty=p.y+110});await sleep(1100);
      const spots=[[BX+50,BY+90],[BX+190,BY+95],[BX+60,BY+165],[BX+185,BY+170],[BX+120,BY+120],[BX+120,BY+180],[BX+40,BY+125],[BX+200,BY+132]];
      parts.forEach((p,i)=>{p.tx=spots[i][0];p.ty=spots[i][1]});SFX.bubble();await sleep(900);
      // waters surround: around Na+ O faces in; around Cl- H faces in
      let wi=0;parts.forEach(p=>{for(let j=0;j<3&&wi<waters.length;j++,wi++){const a=j*2.1+.3;const m=waters[wi];m.tx=p.tx+22*Math.cos(a);m.ty=p.ty+22*Math.sin(a);
        // orient: molecule's O at origin, Hs point along +y local after rotate -> direction (−sin a? ) choose angle so Hs point away (for Na) or toward (for Cl)
        const out=Math.atan2(Math.sin(a),Math.cos(a));m.ta=(p.k==="Na"?out-Math.PI/2:out+Math.PI/2)}});
      await sleep(1600);
      setRow("salt","انفصل إلى أيونات موجبة وسالبة أحاطت بها جزيئات الماء","ذاب ✓");
      card.querySelector("#s1q").replaceChildren(el(`<div class="fb info">لاحظي: الطرف <b style="color:var(--acid)">السالب</b> من جزيء الماء (الأكسجين) اتجه نحو أيون الصوديوم <b>الموجب</b>، وطرفا الهيدروجين <b style="color:var(--base)">الموجبان</b> اتجها نحو أيون الكلور <b>السالب</b>. ملح الطعام مركّب <b>أيوني</b>.</div>`));
    }
    if(k==="sugar"){
      parts=[];for(let i=0;i<6;i++)parts.push({k:"sug",x:BX+BW/2-20+(i%3)*18,y:BY+14+Math.floor(i/3)*16});SFX.thud();
      parts.forEach(p=>{p.tx=p.x;p.ty=p.y+100});await sleep(1000);
      parts.forEach(p=>{p.tx=BX+30+Math.random()*(BW-60);p.ty=BY+80+Math.random()*(BH-100)});SFX.bubble();await sleep(1500);
      setRow("sugar","تفرّقت جزيئاته وتوزعت بين جزيئات الماء","ذاب ✓");
      card.querySelector("#s1q").replaceChildren(el(`<div class="fb info">جزيئات السكر <b>قطبية</b> أيضاً، فتجذبها جزيئات الماء القطبية وتتوزع بينها.</div>`));
    }
    if(k==="oil"){
      parts=[];for(let i=0;i<7;i++)parts.push({k:"oil",x:BX+BW/2-30+(i%4)*18,y:BY+10+Math.floor(i/4)*12});SFX.thud();
      parts.forEach(p=>{p.tx=p.x;p.ty=p.y+120});await sleep(1100);
      parts.forEach((p,i)=>{p.tx=BX+30+i*28;p.ty=BY+48});await sleep(900);
      for(let i=0;i<20;i++){oilLayer+=1;await sleep(40)}parts=[];
      setRow("oil","تجمّعت جزيئاته معاً وطفت فوق الماء","لم يذب ✗");
      card.querySelector("#s1q").replaceChildren(el(`<div class="fb info">جزيئات الزيت <b>غير قطبية</b>، فلا تنجذب إلى جزيئات الماء القطبية، فتتجمع معاً وتطفو فوقه.</div>`));
    }
    done.add(k);b.classList.add("tried");b.textContent="✓ "+b.textContent;
    btns.querySelectorAll("button").forEach(z=>z.disabled=false);
    if(done.size===3)ask();
  }
  async function ask(){
    btns.replaceChildren();
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px"></div>`);card.append(q);
    await mcq(q,{q:"لماذا ذاب الملح والسكر في الماء ولم يذب الزيت؟",opts:[
      {t:"لأن الماء قطبي، فيذيب المواد القطبية والأيونية ولا يذيب المواد غير القطبية",ok:true},
      {t:"لأن الزيت أثقل من الماء",why:"الزيت طفا فوق الماء، فهو أخف منه. والسبب الحقيقي يتعلق بالقطبية."},
      {t:"لأن الملح والسكر صلبان والزيت سائل",why:"الحالة ليست السبب؛ فالخل سائل ويذوب في الماء."},
      {t:"لأن كمية الماء قليلة",why:"لو زدنا الماء لما ذاب الزيت أيضاً."}],right:"صحيح. «الشبيه يذيب الشبيه»: الماء القطبي يذيب المواد القطبية والأيونية."});
    await mcq(q,{q:"عندما ذاب ملح الطعام في الماء، انفصلت بلوراته إلى:",opts:[
      {t:"أيونات موجبة وأيونات سالبة",ok:true},
      {t:"جزيئات غير قطبية",why:"ملح الطعام مركّب أيوني وليس جزيئياً غير قطبي."},
      {t:"ذرات هيدروجين",why:"لا يحتوي ملح الطعام على هيدروجين."}],right:"صحيح. ملح الطعام مركّب أيوني ينفصل إلى Na⁺ و Cl⁻."});
    const n=el(`<button class="btn" type="button">التالي</button>`);q.append(n);n.onclick=()=>{n.remove();stage2()};
  }
}

// ================= Stage 2: concentration =================
function stage2(){
  setSteps(1,TOTAL);
  const card=el(`<section class="card"><h2>٢. التركيز: كم من المذاب في كم من المذيب؟</h2>
  <p>تحضّرين شراب توت. <b>المذاب</b> مسحوق التوت، و<b>المذيب</b> الماء. غيّري الكميتين ولاحظي اللون ومقدار التركيز.</p>
  <div class="stage" id="s2"></div>
  <div class="slider"><label for="g">كمية المذاب (مسحوق التوت) <output id="go">10 جم</output></label><input id="g" type="range" min="0" max="60" step="5" value="10"></div>
  <div class="slider"><label for="v">كمية المذيب (الماء) <output id="vo">200 مل</output></label><input id="v" type="range" min="100" max="1000" step="50" value="200"></div>
  <div class="fb info" id="s2task"></div></section>`);
  main.append(card);card.scrollIntoView({behavior:"smooth",block:"start"});
  const W=360,H=240;const {c,x}=makeCanvas(W,H,"كأس شراب يتغير لونه بتغير التركيز");$("#s2",card).append(c);
  const g=$("#g",card),v=$("#v",card),task=$("#s2task",card);
  let step=0;const lockAt={};
  function conc(){return +g.value/(+v.value)*100}
  function draw(){
    x.clearRect(0,0,W,H);
    const cc=conc();const a=Math.min(.95,.06+cc/30);
    const level=30+(+v.value-100)/900*150;
    beaker(x,90,20,180,190,level,`rgba(124,30,90,${a})`);
    x.fillStyle=css("--ink");x.font="600 15px "+css("--body");x.textAlign="center";
    x.fillText(`التركيز: ${cc.toFixed(1)} جم لكل 100 مل`,W/2,H-8);
    $("#go",card).textContent=g.value+" جم";$("#vo",card).textContent=v.value+" مل";
  }
  const tasks=[
    {t:"المهمة ١: حضّري محلولاً <b>مركّزاً</b> تركيزه <b>20 جم لكل 100 مل أو أكثر</b>.",ok:()=>conc()>=20,msg:"أحسنتِ. كمية المذاب كبيرة بالنسبة لكمية المذيب، فالمحلول مركّز ولونه داكن."},
    {t:"المهمة ٢: الشراب مركّز جداً! <b>دون أن تغيّري كمية المسحوق</b>، اجعليه <b>مخففاً</b>: تركيزه <b>نصف التركيز السابق أو أقل</b>.",ok:()=>conc()<=lockAt.c/2&&+g.value===lockAt.g,msg:"أحسنتِ. أضفتِ مذيباً فقلّت كمية المذاب بالنسبة للمذيب، فصار المحلول مخففاً ولونه فاتحاً."},
  ];
  function showTask(){task.className="fb info";task.innerHTML=tasks[step].t}
  function check(){
    draw();
    if(step===1&&+g.value!==lockAt.g){task.className="fb no";task.innerHTML="في هذه المهمة لا تغيّري كمية المسحوق، غيّري الماء فقط.";return}
    if(step<tasks.length&&tasks[step].ok()){
      SFX.good();task.className="fb ok";task.textContent=tasks[step].msg;
      if(step===0){lockAt.g=+g.value;lockAt.c=conc();step=1;setTimeout(()=>{if(step===1){showTask()}},1800)}
      else{step=2;g.disabled=true;v.disabled=true;setTimeout(ask,600)}
    }
  }
  g.oninput=v.oninput=check;draw();showTask();
  async function ask(){
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px"></div>`);card.append(q);
    await mcq(q,{q:"ماذا فعلتِ لتحويل المحلول المركّز إلى محلول مخفف؟",opts:[
      {t:"أضفتُ مزيداً من المذيب (الماء)",ok:true},
      {t:"أضفتُ مزيداً من المذاب",why:"إضافة المذاب تزيد التركيز."},
      {t:"سخّنتُ المحلول",why:"لم نسخّن شيئاً في هذه المهمة."}],right:"صحيح. التخفيف يكون بإضافة المذيب."});
    const n=el(`<button class="btn" type="button">التالي</button>`);q.append(n);n.onclick=()=>{n.remove();stage3()};
  }
}

// ================= Stage 3: saturation =================
function stage3(){
  setSteps(2,TOTAL);
  const card=el(`<section class="card"><h2>٣. هل يذوب الملح بلا حدود؟</h2>
  <p>أضيفي ملح الطعام إلى <b>100 مل</b> من الماء ملعقةً بعد ملعقة. كل ملعقة = 6 جم.</p>
  <div class="stage" id="s3"></div>
  <div class="row"><button class="btn" id="spoon" type="button">أضيفي ملعقة ملح</button><span class="muted" id="cnt">الملح المضاف: 0 جم</span></div>
  <div id="s3f"></div></section>`);
  main.append(card);card.scrollIntoView({behavior:"smooth",block:"start"});
  const W=360,H=230;const {c,x}=makeCanvas(W,H,"كأس ماء يضاف إليه الملح");$("#s3",card).append(c);
  let grams=0,pile=0,anim=[];const LIMIT=36;
  function draw(){
    x.clearRect(0,0,W,H);
    const top=beaker(x,100,20,160,190,130);
    for(const a of anim){a.y+=3;x.fillStyle="#fff";x.strokeStyle="#888";x.fillRect(a.x,a.y,4,4);x.strokeRect(a.x,a.y,4,4)}
    anim=anim.filter(a=>a.y<(a.stop||200));
    if(pile>0){x.fillStyle="#f5f5f5";x.strokeStyle="#999";x.beginPath();x.moveTo(110,205);x.quadraticCurveTo(180,205-pile*2.2,250,205);x.closePath();x.fill();x.stroke()}
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  const sp=$("#spoon",card),cnt=$("#cnt",card),f=$("#s3f",card);
  sp.onclick=()=>{
    grams+=6;cnt.textContent="الملح المضاف: "+grams+" جم";
    for(let i=0;i<14;i++)anim.push({x:165+Math.random()*30,y:30+Math.random()*20,stop:grams>LIMIT?200:90+Math.random()*80});
    if(grams<=LIMIT){SFX.bubble();f.replaceChildren(el(`<div class="fb info">ذاب الملح كله واختفى. ${grams===LIMIT?"":"أضيفي ملعقة أخرى."}</div>`))}
    else{SFX.thud();pile+=4;f.replaceChildren(el(`<div class="fb no">لم تذب هذه الملعقة! بقي الملح متجمّعاً في القاع مهما حركتِ.</div>`));if(grams>=LIMIT+12){sp.disabled=true;ask()}}
  };
  async function ask(){
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px"></div>`);card.append(q);
    await mcq(q,{q:"بعد أن بقي الملح في القاع ولم يذب، نسمي هذا المحلول:",opts:[
      {t:"محلولاً مشبعاً",ok:true},{t:"محلولاً مخففاً",why:"المخفف يستطيع إذابة مزيد من المذاب."},{t:"مادة نقية",why:"ما زال مخلوطاً من ماء وملح."}],
      right:"صحيح. المحلول المشبع يحتوي أكبر كمية من المذاب يمكن أن تذوب فيه عند درجة الحرارة نفسها."});
    setSteps(3,TOTAL);
    const b=el(`<button class="btn alt" type="button">احصلي على رمز الإنجاز</button>`);q.append(b);
    b.onclick=()=>{setSteps(TOTAL,TOTAL);b.remove();const t=el(`<section class="card"></section>`);main.append(t);finish(t,CODE,[
      "الماء مذيب عام لأن جزيئاته قطبية، فيذيب المواد القطبية والأيونية.",
      "الزيت لا يذوب في الماء لأن جزيئاته غير قطبية.",
      "ملح الطعام مركّب أيوني ينفصل في الماء إلى أيونات موجبة وسالبة.",
      "المحلول المركّز فيه كمية كبيرة من المذاب بالنسبة للمذيب، والمخفف فيه كمية قليلة، ونخففه بإضافة المذيب.",
      "المحلول المشبع لا يذوب فيه مزيد من المذاب عند درجة الحرارة نفسها."])};
  }
}

main.append(el(`<section class="card"><p>في هذا المعمل تكتشفين لماذا يذيب الماء مواد كثيرة، وكيف تجعلين المحلول <b>مركّزاً</b> أو <b>مخففاً</b>، ومتى يصبح <b>مشبعاً</b>.</p></section>`));
stage1();
// auto-test hook
window.__labstep=async()=>{
  const z=[...document.querySelectorAll("#s1btns .btn:not(.tried)")].find(b=>!b.disabled);if(z){z.click();await sleep(5200);return true}
  const g=document.getElementById("g");if(g&&!g.disabled){const v=document.getElementById("v");g.value=60;v.value=200;g.dispatchEvent(new Event("input"));await sleep(2200);v.value=1000;v.dispatchEvent(new Event("input"));await sleep(900);return true}
  const sp=document.getElementById("spoon");if(sp&&!sp.disabled){sp.click();await sleep(150);return true}
  return false;
};

</script>
