<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>معمل حدود الصفائح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow lab sheet — step header, live map, task card under it */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f2328; --muted:#5d6570; --line:#d9d4c9;
  --ocean:#d7e3ea; --land:#e6dcc6; --landline:#c9bc9f;
  --magma:#d9480f; --magma-soft:#fde7dc; --quake:#7b2cbf; --plate:#1c5d8c;
  --ok:#1f7a4d; --ok-soft:#dff1e7; --bad:#b42318; --bad-soft:#fbe4e1;
  --ar:#e8a33d; --af:#2f9e8f;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --ocean:#17293a; --land:#3a3428; --landline:#544b39;
  --magma:#ff7a3d; --magma-soft:#3b2116; --quake:#c08cff; --plate:#6cb8ef;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a; --ar:#f0b45a; --af:#4cc3b3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --ocean:#17293a; --land:#3a3428; --landline:#544b39;
  --magma:#ff7a3d; --magma-soft:#3b2116; --quake:#c08cff; --plate:#6cb8ef;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a; --ar:#f0b45a; --af:#4cc3b3; color-scheme:dark}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.02em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0;text-wrap:balance}
.steps{display:flex;gap:6px;list-style:none;margin:6px 0 0;padding:0}
.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps li.done{background:var(--plate)}
.steps li.now{background:var(--magma)}
.mapbox{background:var(--ocean);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox.picking svg{cursor:crosshair}
.lbl{font-family:var(--body);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.lbl.ocean{fill:var(--plate);stroke:var(--ocean);stroke-width:4px;font-size:21px;font-weight:500;opacity:.85}
.lbl.sea{fill:var(--plate);stroke:var(--ocean);stroke-width:3px;font-size:15px;font-weight:500;opacity:.85}
.lbl.plate{fill:var(--ink);stroke:var(--land);stroke-width:4px;font-size:17px;font-weight:600}
.zoommap{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.zl{font-family:var(--body);paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.zl.big{font-size:24px;font-weight:700;fill:var(--ink);stroke:var(--land);stroke-width:5px}
.zl.sea{font-size:17px;font-weight:500;fill:var(--plate);stroke:var(--ocean);stroke-width:4px}
.zl.big2{font-size:22px;font-weight:700;fill:var(--plate);stroke:var(--ocean);stroke-width:5px;opacity:.75}
.zl.note{font-size:15px;font-weight:500;fill:var(--muted);stroke:var(--ocean);stroke-width:4px}
.zl.small{font-size:16px;font-weight:600;fill:var(--magma);stroke:var(--land);stroke-width:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;display:inline-block}
.sw.v{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--magma)}
.sw.q{border-radius:50%;background:var(--quake)}
.sw.p{height:3px;width:16px;background:var(--plate)}
.sw.r{height:6px;width:16px;background:var(--magma);opacity:.45;border-radius:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.card p{margin:0;max-width:65ch}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:right;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--plate)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.btn{font:inherit;font-weight:600;background:var(--magma);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;align-self:flex-start}
.btn.alt{background:var(--plate)}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.counter{font-family:var(--display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.done-card{border:2px solid var(--ok)}
.code{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.15em;direction:ltr;text-align:center;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px;font-variant-numeric:tabular-nums}
ul.learned{margin:0;padding-inline-start:20px;display:grid;gap:4px}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">علوم الثالث المتوسط · الفصل الثاني: تغيرات الأرض · مسار الإتقان ١</div>
    <h1>معمل حدود الصفائح</h1>
    <ol class="steps" id="steps" aria-label="مراحل المعمل"><li></li><li></li><li></li><li></li><li></li></ol>
  </header>

  <div class="mapbox" id="mapbox">
    <svg id="map" viewBox="0 0 960 500" role="img" aria-label="خريطة العالم"></svg>
    <div class="legend" id="legend">
      <span><i class="sw v"></i>بركان</span>
      <span><i class="sw q"></i>زلزال</span>
      <span id="lgP" hidden><i class="sw p"></i>حدود الصفائح</span>
      <span id="lgR" hidden><i class="sw r"></i>حزام النار</span>
    </div>
  </div>

  <section class="card" id="task" aria-live="polite"></section>
</div>

<style>
.fxglow{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}
.fxglow.ok{box-shadow:inset 0 0 0 6px #2fbf71,inset 0 0 90px 30px rgba(47,191,113,.55);animation:fxg 1s ease-out}
.fxglow.no{box-shadow:inset 0 0 0 6px #e5484d,inset 0 0 90px 30px rgba(229,72,77,.45);animation:fxg .8s ease-out}
@keyframes fxg{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.fxbadge{position:fixed;left:50%;top:40%;z-index:31;pointer-events:none;font-family:var(--display);font-weight:700;font-size:42px;color:#fff;background:#1f9d5c;padding:8px 30px;border-radius:999px;opacity:0;transform:translate(-50%,-50%) scale(.6)}
.fxbadge.show{animation:fxb 1.1s ease-out}
@keyframes fxb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.fxbadge.show{animation:none;opacity:0}.fxglow.ok,.fxglow.no{animation-duration:.01s}}
.wrap>header{padding-inline-end:110px}
.sndbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:20;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.sndbtn:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
</style>
<button class="sndbtn" id="sndbtn" aria-pressed="true">الصوت: يعمل</button>
<script>
const SFX=(()=>{
  let ac=null,on=true;
  const btn=document.getElementById("sndbtn");
  btn.onclick=()=>{on=!on;btn.setAttribute("aria-pressed",on);btn.textContent=on?"الصوت: يعمل":"الصوت: متوقف";};
  const A=()=>{if(!on)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}};
  function tone(f,t0,d,type,vol,f2){const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.2,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}
  function noise(t0,d,vol,fType,fFreq,fEnd){const c=A();if(!c)return;const n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=fType||"lowpass";f.frequency.setValueAtTime(fFreq||800,c.currentTime+t0);if(fEnd)f.frequency.exponentialRampToValueAtTime(fEnd,c.currentTime+t0+d);const g=c.createGain();g.gain.setValueAtTime(vol||.3,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+t0)}
  const fx=document.createElement("div");fx.className="fxglow";fx.setAttribute("aria-hidden","true");document.body.append(fx);
  const badge=document.createElement("div");badge.className="fxbadge";badge.setAttribute("aria-hidden","true");badge.textContent="ممتاز";document.body.append(badge);
  function glow(kind){fx.className="fxglow";badge.className="fxbadge";void fx.offsetWidth;fx.className="fxglow "+kind;if(kind==="ok"){void badge.offsetWidth;badge.className="fxbadge show"}}
  const ding=()=>{tone(1318,0,.7,"sine",.22);tone(2637,0,.35,"sine",.06)};
  const buzz=()=>{tone(150,0,.28,"square",.07,120)};
  return{
    good(){glow("ok");ding()},
    bad(){glow("no");buzz()},
    win(){glow("ok");ding();setTimeout(()=>tone(1568,0,.8,"sine",.2),220)},
    tick(){tone(880,0,.08,"sine",.1)},
    rumble(d,vol){noise(0,d||2,vol||.5,"lowpass",140,60)},
    boom(){noise(0,2.5,1,"lowpass",900,40);tone(70,0,1.4,"sine",.6,30)},
    bubble(){for(let i=0;i<10;i++)tone(300+Math.random()*500,i*.12+Math.random()*.05,.08,"sine",.07,700+Math.random()*400)},
    hiss(d){noise(0,d||1.5,.15,"highpass",3000)},
    whoosh(){noise(0,.6,.25,"bandpass",400,2400)},
    thud(){tone(110,0,.25,"sine",.35,50)},
  };
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(async()=>{
let LAND,PB,PLATEPOLY;
try{
const [land,pb,pl]=await Promise.all([
 fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-50m.json").then(r=>r.json()),
 fetch("https://cdn.jsdelivr.net/gh/fraxen/tectonicplates@master/GeoJSON/PB2002_boundaries.json").then(r=>r.json()),
 fetch("https://cdn.jsdelivr.net/gh/fraxen/tectonicplates@master/GeoJSON/PB2002_plates.json").then(r=>r.json())]);
LAND=land;
PB=pb.features.map(f=>f.geometry.coordinates);
PLATEPOLY=pl.features.filter(f=>["AR","AF","SO"].includes(f.properties.Code)).map(f=>({code:f.properties.Code,coords:f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates}));
}catch(err){document.getElementById("task").innerHTML="<h2>تعذّر تحميل الخريطة</h2><p>تحقّقي من اتصال الإنترنت ثم أعيدي فتح الصفحة.</p>";return}
const CODE="4721";

const VOLC=[[138.73,35.36],[105.42,-6.1],[120.35,15.13],[-122.18,46.2],[-98.62,19.02],[-78.44,-0.68],[-71.93,-39.42],[14.99,37.75],[14.43,40.82],[-19.7,63.98],[-155.29,19.42],[-155.6,19.48],[37.35,-3.07],[40.67,13.6],[29.25,-1.52],[39.78,23.08],[37.75,25.17],[160.64,56.06],[167.15,-77.53],[175.57,-39.28],[120.99,14.0],[110.45,-7.54],[130.66,31.58],[-153.43,59.36],[-152.74,60.49],[-121.76,46.85],[-122.19,41.41],[-103.62,19.51],[-90.88,14.47],[-84.7,10.46],[-78.44,-1.47],[-67.73,-23.37],[-68.54,-27.11],[-19.62,63.63],[-25.5,37.75],[-16.64,28.27],[52.11,35.95],[44.3,39.7],[123.69,13.26],[118.0,-8.25],[152.2,-4.27],[169.44,-19.53],[-175.39,-20.55],[141.29,42.54],[147.9,45.4],[155.5,50.3],[-176.0,51.9],[-165.9,54.1],[-72.6,-45.9],[-71.4,-16.4],[-75.4,4.9],[-61.2,16.0],[-61.1,14.8],[12.3,4.2],[125.4,1.4],[127.9,1.7],[148.1,-5.5],[159.0,-9.0],[-177.6,-29.3]];
const RING=[[166,-46],[174,-41],[177,-37],[-178,-30],[-174,-20],[-173,-15],[168,-17],[158,-9],[151,-5],[127,1],[124,13],[122,24],[129,28],[139,35],[142,41],[151,46],[161,55],[175,52],[-175,52],[-162,54],[-152,60],[-137,58],[-123,49],[-124,42],[-121,36],[-104,20],[-97,17],[-91,14],[-85,10],[-78,7],[-80,-1],[-77,-12],[-70,-20],[-72,-33],[-74,-42],[-75,-52]];

const W=960,H=500;
const svg=d3.select("#map");
const proj=d3.geoNaturalEarth1().rotate([-150,0]).fitExtent([[6,6],[W-6,H-6]],{type:"Sphere"});
const path=d3.geoPath(proj);
const land=topojson.feature(LAND,LAND.objects.land);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

svg.append("path").datum({type:"Sphere"}).attr("d",path).attr("fill","var(--ocean)");
svg.append("path").datum(d3.geoGraticule10()).attr("d",path).attr("fill","none").attr("stroke","var(--landline)").attr("stroke-opacity",.35).attr("stroke-width",.5);
svg.append("path").datum(land).attr("d",path).attr("fill","var(--land)").attr("stroke","var(--landline)").attr("stroke-width",.35);
const gOcean=svg.append("g");
const gRing=svg.append("g");
const gPlate=svg.append("g");
const gQuake=svg.append("g");
const gVolc=svg.append("g");
const gPlateLbl=svg.append("g");
const gUser=svg.append("g");
const OCEANS=[["المحيط الهادي",-165,32,"ocean"],["المحيط الأطلسي",-42,28,"ocean"],["المحيط الهندي",78,-22,"ocean"],["المحيط المتجمد الشمالي",175,77,"ocean"],["المحيط الجنوبي",100,-60,"ocean"],["البحر الأحمر",34,21,"sea"],["الخليج العربي",55,29,"sea"],["البحر المتوسط",18,36,"sea"],["بحر العرب",63,14,"sea"]];
const PLATES=[["صفيحة المحيط الهادي",-140,-12],["صفيحة أمريكا الشمالية",-100,50],["صفيحة أمريكا الجنوبية",-55,-14],["الصفيحة الإفريقية",17,6],["الصفيحة الأوراسية",95,55],["صفيحة الهند - أستراليا",125,-30],["صفيحة القطب الجنوبي",150,-73],["الصفيحة العربية",46,23.5],["صفيحة نازكا",-92,-17],["صفيحة كوكوس",-98,8],["صفيحة الفلبين",133,17],["صفيحة الكاريبي",-73,15]];
function drawLabels(g,data,cls){g.selectAll("text").data(data).join("text").attr("class",d=>"lbl "+(cls||d[3])).attr("text-anchor","middle").attr("x",d=>proj([d[1],d[2]])[0]).attr("y",d=>proj([d[1],d[2]])[1]).text(d=>d[0])}
drawLabels(gOcean,OCEANS);

/* earthquake sample: deterministic points along boundaries */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const QUAKES=[];
PB.forEach(l=>{for(let i=0;i<l.length-1;i++){if(rnd()<0.33){const t=rnd(),a=l[i],b=l[i+1];if(Math.abs(a[0]-b[0])>90)continue;QUAKES.push([a[0]+(b[0]-a[0])*t+(rnd()-.5)*2.2,a[1]+(b[1]-a[1])*t+(rnd()-.5)*2.2])}}});

function drawQuakes(){gQuake.selectAll("circle").data(QUAKES).join("circle").attr("cx",d=>proj(d)[0]).attr("cy",d=>proj(d)[1]).attr("r",2.1).attr("fill","var(--quake)").attr("fill-opacity",.55)}
function tri(x,y,s){return `M${x},${y-s}L${x+s*.9},${y+s*.7}L${x-s*.9},${y+s*.7}Z`}
function drawVolc(){gVolc.selectAll("path").data(VOLC).join("path").attr("d",d=>{const p=proj(d);return tri(p[0],p[1],5)}).attr("fill","var(--magma)").attr("stroke","var(--surface)").attr("stroke-width",.8)}
function drawPlates(animate){
  const sel=gPlate.selectAll("path").data(PB).join("path").attr("d",l=>path({type:"LineString",coordinates:l})).attr("fill","none").attr("stroke","var(--plate)").attr("stroke-width",1.8).attr("stroke-linejoin","round");
  if(animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches){sel.each(function(){const L=this.getTotalLength();if(!L)return;this.style.setProperty("--len",L);this.style.strokeDasharray=L;this.style.animation="draw 1.6s ease-out forwards"})}
  document.getElementById("lgP").hidden=false;
  drawLabels(gPlateLbl,PLATES,"plate");
}
function hidePlates(){gPlate.selectAll("*").remove();document.getElementById("lgP").hidden=true}
function drawRing(){gRing.append("path").datum({type:"LineString",coordinates:RING}).attr("d",path).attr("fill","none").attr("stroke","var(--magma)").attr("stroke-opacity",.4).attr("stroke-width",16).attr("stroke-linecap","round").attr("stroke-linejoin","round");document.getElementById("lgR").hidden=false}

const BV=[];PB.forEach(l=>l.forEach(p=>BV.push(p)));
function distToBoundary(pt){let m=9;for(const p of BV){const d=d3.geoDistance(pt,p);if(d<m)m=d}return m*180/Math.PI}
function evtLonLat(e){const r=svg.node().getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;return proj.invert([x,y])}
function inPacific(ll){if(!ll)return false;let [lon,lat]=ll;const L=(lon+360)%360;if(d3.geoContains(land,ll))return false;if(L<125||L>290||lat<-58||lat>62)return false;if(L>262&&lat>17)return false;if(L>276&&lat>8)return false;return true}

/* zoomed Arabia map with colored plates */
function fixPoly(rings){const g={type:"Polygon",coordinates:rings};if(d3.geoArea(g)>2*Math.PI)return{type:"Polygon",coordinates:rings.map(r=>r.slice().reverse())};return g}
function arabiaMap(){
  const w=600,h=520;
  const s=d3.create("svg").attr("viewBox",`0 0 ${w} ${h}`).attr("role","img").attr("aria-label","خريطة الصفيحة العربية والصفيحة الإفريقية").attr("class","zoommap");
  const box={type:"MultiPoint",coordinates:[[24,8],[62,8],[24,38],[62,38]]};
  const p=d3.geoMercator().fitExtent([[8,8],[w-8,h-8]],box);const pa=d3.geoPath(p);
  s.append("rect").attr("width",w).attr("height",h).attr("fill","var(--ocean)");
  s.append("path").datum(land).attr("d",pa).attr("fill","var(--land)").attr("stroke","var(--landline)").attr("stroke-width",.6);
  s.append("clipPath").attr("id","landclip").append("path").datum(land).attr("d",pa);
  const gf=s.append("g").attr("clip-path","url(#landclip)");
  PLATEPOLY.forEach(pl=>{const fill=pl.code==="AR"?"var(--ar)":"var(--af)";pl.coords.forEach(rings=>{gf.append("path").datum(fixPoly(rings)).attr("d",pa).attr("fill",fill).attr("fill-opacity",.5).attr("stroke","none")})});
  s.append("path").datum(land).attr("d",pa).attr("fill","none").attr("stroke","var(--landline)").attr("stroke-width",.8);
  PB.forEach(l=>s.append("path").datum({type:"LineString",coordinates:l}).attr("d",pa).attr("fill","none").attr("stroke","var(--plate)").attr("stroke-width",2.4));
  [[39.78,23.08,"حرة رهط"],[37.75,25.17,"حرة لونير"]].forEach(v=>{const q=p([v[0],v[1]]);s.append("path").attr("d",tri(q[0],q[1],8)).attr("fill","var(--magma)").attr("stroke","var(--surface)");s.append("text").attr("class","zl small").attr("x",q[0]+12).attr("y",q[1]+5).attr("text-anchor","end").text(v[2])});
  const arrow=(a,b)=>{const A=p(a),B=p(b);s.append("line").attr("x1",A[0]).attr("y1",A[1]).attr("x2",B[0]).attr("y2",B[1]).attr("stroke","var(--ink)").attr("stroke-width",3).attr("marker-end","url(#ah)")};
  s.append("defs").html('<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="var(--ink)"/></marker>');
  arrow([40.3,20.6],[44,22.8]);arrow([36.6,19.6],[33,18]);
  [["الصفيحة العربية",49,20.5,"big"],["الصفيحة الإفريقية",29,15,"big"],["البحر الأحمر",37.2,19.4,"sea"],["الخليج العربي",51.5,27.6,"sea"],["خليج عدن",48,12.3,"sea"],["البحر المتوسط",30,33.6,"sea"]].forEach(t=>{const q=p([t[1],t[2]]);s.append("text").attr("class","zl "+t[3]).attr("x",q[0]).attr("y",q[1]).attr("text-anchor","middle").text(t[0])});
  return s.node();
}

  const s=d3.create("svg").attr("viewBox",`0 0 ${w} ${h}`).attr("role","img").attr("aria-label","خريطة جزر هاواي والبقعة الساخنة").attr("class","zoommap");
  const box={type:"MultiPoint",coordinates:[[-163,17],[-153.5,17],[-163,23.5],[-153.5,23.5]]};
  const p=d3.geoMercator().fitExtent([[8,8],[w-8,h-8]],box);const pa=d3.geoPath(p);
  s.append("defs").html('<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="var(--ink)"/></marker><radialGradient id="hs"><stop offset="0" stop-color="var(--magma)" stop-opacity=".9"/><stop offset="1" stop-color="var(--magma)" stop-opacity="0"/></radialGradient>');
  s.append("rect").attr("width",w).attr("height",h).attr("fill","var(--ocean)");
  const hs=p([-155.3,19.4]);s.append("circle").attr("cx",hs[0]).attr("cy",hs[1]).attr("r",70).attr("fill","url(#hs)");
  s.append("path").datum(land).attr("d",pa).attr("fill","var(--land)").attr("stroke","var(--ink)").attr("stroke-width",1);
  [[-155.29,19.42],[-155.6,19.48]].forEach(v=>{const q=p(v);s.append("path").attr("d",tri(q[0],q[1],7)).attr("fill","var(--magma)").attr("stroke","var(--surface)")});
  const A=p([-157.6,20.1]),B=p([-161.3,22.2]);s.append("line").attr("x1",A[0]).attr("y1",A[1]).attr("x2",B[0]).attr("y2",B[1]).attr("stroke","var(--ink)").attr("stroke-width",3.5).attr("marker-end","url(#ah2)");
  [["صفيحة المحيط الهادي",-160.3,18.4,"big2"],["جزر هاواي",-157,22.7,"sea"],["اتجاه حركة الصفيحة",-161.2,22.8,"note"],["لا توجد حدود صفائح قريبة",-160.3,17.6,"note"]].forEach(t=>{const q=p([t[1],t[2]]);s.append("text").attr("class","zl "+t[3]).attr("x",q[0]).attr("y",q[1]).attr("text-anchor","middle").text(t[0])});

/* steps */
const task=document.getElementById("task");
const stepsEl=[...document.querySelectorAll("#steps li")];
function setStep(i){stepsEl.forEach((li,k)=>{li.className=k<i?"done":k===i?"now":""})}
function el(h){const t=document.createElement("template");t.innerHTML=h.trim();return t.content}
function quiz(title,text,opts,right,hintWrong,okMsg,next,extra){
  task.replaceChildren(el(`<h2>${title}</h2><p>${text}</p><div class="xtra"></div><div class="opts">${opts.map((o,i)=>`<button class="opt" id="o${i}" data-i="${i}">${o}</button>`).join("")}</div><div class="fb" hidden></div>`));
  const fb=task.querySelector(".fb");const xt=task.querySelector(".xtra");if(extra)xt.append(extra);else xt.remove();
  task.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===right){SFX.good();task.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");fb.hidden=false;fb.className="fb ok";fb.textContent=okMsg;
      const n=document.createElement("button");n.className="btn";n.textContent="التالي";n.onclick=next;task.append(n);n.focus()}
    else{SFX.bad();b.classList.add("wrong");b.disabled=true;fb.hidden=false;fb.className="fb no";fb.textContent=hintWrong}
  });
}

function step1(){
  setStep(0);drawVolc();drawQuakes();
  quiz("المرحلة الأولى: رصد","على الخريطة مواقع براكين حقيقية ▲ ومواقع زلازل ●. تأمّلي توزيعها جيداً، ثم أجيبي:",
    ["موزعة بشكل عشوائي على سطح الأرض","تتجمع على شكل أحزمة وخطوط طويلة","تتركز في وسط القارات فقط"],1,
    "انظري مرة أخرى: هل تملأ النقاط الخريطة كلها، أم تصطف في خطوط؟","صحيح! البراكين والزلازل تصطف في أحزمة طويلة. فما سرّ هذه الأحزمة؟",step2);
}
function step2(){
  setStep(1);
  task.replaceChildren(el(`<h2>المرحلة الثانية: اكشفي السر</h2><p>الغلاف الصخري مقسّم إلى صفائح تتحرك. اضغطي الزر لإظهار حدود هذه الصفائح فوق الخريطة.</p><button class="btn alt" id="showP">أظهري حدود الصفائح</button>`));
  document.getElementById("showP").onclick=()=>{SFX.whoosh();drawPlates(true);setTimeout(()=>quiz("المرحلة الثانية: اكشفي السر","قارني الخطوط الزرقاء بمواقع البراكين والزلازل. أين يقع معظمها؟",
    ["في وسط الصفائح","عند حدود الصفائح","قرب القطبين"],1,"قارني مكان المثلثات والنقاط بالخطوط الزرقاء.",
    "أحسنتِ! تحدث معظم الزلازل والبراكين عند حدود الصفائح، حيث تتقارب الصفائح أو تتباعد أو تنزلق.",step3),900)};
}
let placed=0;
function step3(){
  setStep(2);hidePlates();placed=0;gUser.selectAll("*").remove();
  task.replaceChildren(el(`<h2>المرحلة الثالثة: توقّعي</h2><p>أخفينا حدود الصفائح. سجّلت محطات الرصد ٣ زلازل جديدة. اضغطي على الخريطة في الأماكن التي تتوقعين حدوثها فيها.</p><div class="counter" id="cnt">الزلازل الصحيحة: ٠ من ٣</div><div class="fb" hidden id="fb3"></div>`));
  const box=document.getElementById("mapbox");box.classList.add("picking");
  svg.on("click",e=>{
    const ll=evtLonLat(e);if(!ll)return;const p=proj(ll);const d=distToBoundary(ll);const ok=d<4.5;
    gUser.append("circle").attr("cx",p[0]).attr("cy",p[1]).attr("r",9).attr("fill","none").attr("stroke",ok?"var(--ok)":"var(--bad)").attr("stroke-width",3).style("transform-origin",`${p[0]}px ${p[1]}px`).style("animation","pop .25s ease-out");
    const fb=document.getElementById("fb3");fb.hidden=false;
    if(ok){placed++;SFX.good();fb.className="fb ok";fb.textContent="توقّع صحيح، هذا المكان قريب من حدود صفيحتين."}
    else{SFX.bad();fb.className="fb no";fb.textContent="هذا المكان في وسط صفيحة، والزلازل فيه نادرة. ابحثي عن أحزمة النقاط البنفسجية."}
    document.getElementById("cnt").textContent=`الزلازل الصحيحة: ${"٠١٢٣"[Math.min(placed,3)]} من ٣`;
    if(placed>=3){svg.on("click",null);box.classList.remove("picking");drawPlates(false);
      const n=document.createElement("button");n.className="btn";n.textContent="التالي";n.onclick=step4;task.append(n);n.focus()}
  });
}
function step4(){
  setStep(3);gUser.selectAll("*").remove();
  task.replaceChildren(el(`<h2>المرحلة الرابعة: حزام النار</h2><p>يوجد حزام طويل تتجمع فيه معظم البراكين النشطة وأقوى الزلازل في العالم. اضغطي على المحيط الذي يحيط به هذا الحزام.</p><div class="fb" hidden id="fb4"></div>`));
  const box=document.getElementById("mapbox");box.classList.add("picking");
  svg.on("click",e=>{
    const ll=evtLonLat(e);const fb=document.getElementById("fb4");fb.hidden=false;
    if(inPacific(ll)){SFX.good();svg.on("click",null);box.classList.remove("picking");drawRing();fb.className="fb ok";
      fb.textContent="صحيح! حزام النار يحيط بالمحيط الهادي، لأن صفيحة المحيط الهادي تغطس أسفل الصفائح المحيطة بها فتتكوّن الصهارة.";
      const n=document.createElement("button");n.className="btn";n.textContent="التالي";n.onclick=step5;task.append(n);n.focus()}
    else{SFX.bad();fb.className="fb no";fb.textContent="ليس هذا. ابحثي عن المحيط الأكبر الذي تحيط به المثلثات من كل الجهات."}
  });
}
function step5(){
  setStep(4);
  quiz("المرحلة الخامسة: حالات خاصة","تأمّلي الخريطة المكبّرة: جزر هاواي تقع في وسط صفيحة المحيط الهادي، وأقرب حدود صفائح تبعد عنها آلاف الكيلومترات، ومع ذلك فيها براكين نشطة. ما السبب؟",
    ["لأنها تقع على حدود متقاربة","لأنها تقع فوق بقعة ساخنة تندفع منها الصهارة إلى أعلى","لأنها تقع على حدود متباعدة"],1,
    "هاواي ليست على أي حدود. ما اسم المناطق التي تندفع منها الصهارة في وسط الصفيحة؟",
    "صحيح! البقع الساخنة استثناء: براكين في وسط الصفيحة.",()=>quiz("المرحلة الخامسة: حالات خاصة","تأمّلي الخريطة المكبّرة: الصفيحة العربية بلون والصفيحة الإفريقية بلون آخر، والأسهم تبيّن اتجاه حركتهما. في غرب المملكة حرات بركانية مثل حرة رهط قرب المدينة المنورة وحرة لونير قرب ينبع. ما سبب النشاط البركاني والزلزالي هناك؟",
      ["تباعد الصفيحة العربية عن الصفيحة الإفريقية على امتداد البحر الأحمر","وجود بقعة ساخنة تحت الربع الخالي","تقارب الصفيحة العربية مع صفيحة المحيط الهادي"],0,
      "تذكّري: ما الذي يحدث على امتداد البحر الأحمر بين الصفيحتين؟","أحسنتِ! الصفيحة العربية تبتعد عن الصفيحة الإفريقية، والبحر الأحمر يتسع بينهما، ولذلك تكثر الحرات البركانية والزلازل في غرب المملكة.",finish,arabiaMap()),hawaiiMap());
}
function finish(){
  SFX.win();
  stepsEl.forEach(li=>li.className="done");
  task.classList.add("done-card");
  task.replaceChildren(el(`<h2>أنهيتِ المعمل</h2><p>رمز الإنجاز الخاص بهذا المعمل:</p><div class="code">${CODE}</div><p>عودي إلى النموذج واكتبي هذا الرمز، ثم أجيبي عن أسئلة التحقق.</p><h2>ما تعلمتِه</h2><ul class="learned"><li>تحدث معظم الزلازل والبراكين عند حدود الصفائح.</li><li>حزام النار يحيط بالمحيط الهادي.</li><li>البقع الساخنة تكوّن براكين في وسط الصفيحة مثل هاواي.</li><li>النشاط البركاني والزلزالي في غرب المملكة سببه تباعد الصفيحتين العربية والإفريقية.</li></ul>`));
}
step1();
})();
