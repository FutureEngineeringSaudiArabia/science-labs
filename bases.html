<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>معمل القواعد والتعادل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --ink:#1f2328; --muted:#5d6570; --line:#d9d4c9;
  --stage:#e8eef2; --accent:#0f6e8c; --accent-soft:#dcedf3; --warm:#c2410c; --warm-soft:#fde9dc;
  --ok:#1f7a4d; --ok-soft:#dff1e7; --bad:#b42318; --bad-soft:#fbe4e1;
  --acid:#d1344a; --base:#2b5fd9; --neutral:#2f9e5a; --water:#7fb8e6; --glass:#c9d6de;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --stage:#1a242c; --accent:#5cc0e0; --accent-soft:#16323d; --warm:#ff8a4c; --warm-soft:#3b2116;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --acid:#ff6b7f; --base:#7aa2ff; --neutral:#5fd39a; --water:#3d6f99; --glass:#4a5863; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1c2026; --ink:#eceff3; --muted:#a3abb6; --line:#2e343c;
  --stage:#1a242c; --accent:#5cc0e0; --accent-soft:#16323d; --warm:#ff8a4c; --warm-soft:#3b2116;
  --ok:#5fd39a; --ok-soft:#173326; --bad:#ff8a7a; --bad-soft:#3a1d1a;
  --acid:#ff6b7f; --base:#7aa2ff; --neutral:#5fd39a; --water:#3d6f99; --glass:#4a5863; color-scheme:dark}
html{direction:rtl}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.wrap>header{display:flex;flex-direction:column;gap:4px;padding-inline-end:110px}
.eyebrow{font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);line-height:1.3;margin:0;text-wrap:balance}
.steps{display:flex;gap:6px;list-style:none;margin:6px 0 0;padding:0}
.steps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps li.done{background:var(--accent)}
.steps li.now{background:var(--warm)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.card h3{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.card p{margin:0;max-width:68ch}
.muted{color:var(--muted);font-size:14px}
.stage{background:var(--stage);border-radius:10px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:right;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;background:var(--warm);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;align-self:flex-start}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:10px 14px;font-size:15px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--accent-soft);color:var(--ink)}
.done-card{border:2px solid var(--ok)}
.code{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:.15em;direction:ltr;text-align:center;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px;font-variant-numeric:tabular-nums}
ul.learned{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--warm);background:var(--warm-soft)}
.chip.placed{opacity:.35;cursor:default}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{font:inherit;text-align:right;background:var(--bg);color:var(--ink);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;min-height:96px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.bin b{font-family:var(--display);font-weight:500;font-size:15px}
.bin .in{display:flex;flex-wrap:wrap;gap:4px}
.bin .in span{font-size:13px;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:2px 10px}
.bin.ready{border-color:var(--warm)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th{font-weight:600;color:var(--muted);font-size:13px}
td.empty{color:var(--muted)}
.slider{display:flex;flex-direction:column;gap:4px}
.slider label{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.slider output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--warm)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.seg button{font:inherit;font-size:15px;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;cursor:pointer;line-height:1.35}
.seg button small{display:block;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{border-color:var(--warm);background:var(--warm-soft)}
.seg button.tried{border-style:solid}
.seg button.tried::after{content:" ✓";color:var(--ok);font-size:12px}
.order{display:grid;gap:6px;counter-reset:n;padding:0;margin:0;list-style:none}
.order li{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:8px 12px;counter-increment:n}
.order li::before{content:counter(n) ". ";font-weight:700}
.order li.slot{background:var(--bg);color:var(--muted);border:1.5px dashed var(--line)}
.order li.slot::before{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}


</style>
<div class="wrap">
<header><span class="eyebrow">معمل افتراضي · ثاني متوسط · المخاليط والمحاليل</span><h1>القواعد والرقم الهيدروجيني والتعادل</h1><ul class="steps" id="steps" aria-hidden="true"></ul></header>
<main id="main" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<style>
.fxglow{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0}
.fxglow.ok{box-shadow:inset 0 0 0 6px #2fbf71,inset 0 0 90px 30px rgba(47,191,113,.55);animation:fxg 1s ease-out}
.fxglow.no{box-shadow:inset 0 0 0 6px #e5484d,inset 0 0 90px 30px rgba(229,72,77,.45);animation:fxg .8s ease-out}
@keyframes fxg{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.fxbadge{position:fixed;left:50%;top:40%;z-index:31;pointer-events:none;font-family:var(--display);font-weight:700;font-size:42px;color:#fff;background:#1f9d5c;padding:8px 30px;border-radius:999px;opacity:0;transform:translate(-50%,-50%) scale(.6)}
.fxbadge.show{animation:fxb 1.1s ease-out}
@keyframes fxb{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.fxbadge.show{animation:none;opacity:0}.fxglow.ok,.fxglow.no{animation-duration:.01s}}
.wrap>header{padding-inline-end:110px}
.sndbtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:20;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.sndbtn:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
</style>
<button class="sndbtn" id="sndbtn" aria-pressed="true">الصوت: يعمل</button>
<script>
const SFX=(()=>{
  let ac=null,on=true;
  const btn=document.getElementById("sndbtn");
  btn.onclick=()=>{on=!on;btn.setAttribute("aria-pressed",on);btn.textContent=on?"الصوت: يعمل":"الصوت: متوقف";};
  const A=()=>{if(!on)return null;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}};
  function tone(f,t0,d,type,vol,f2){const c=A();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+t0+d);g.gain.setValueAtTime(0,c.currentTime+t0);g.gain.linearRampToValueAtTime(vol||.2,c.currentTime+t0+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t0);o.stop(c.currentTime+t0+d+.05)}
  function noise(t0,d,vol,fType,fFreq,fEnd){const c=A();if(!c)return;const n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=fType||"lowpass";f.frequency.setValueAtTime(fFreq||800,c.currentTime+t0);if(fEnd)f.frequency.exponentialRampToValueAtTime(fEnd,c.currentTime+t0+d);const g=c.createGain();g.gain.setValueAtTime(vol||.3,c.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t0+d);s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+t0)}
  const fx=document.createElement("div");fx.className="fxglow";fx.setAttribute("aria-hidden","true");document.body.append(fx);
  const badge=document.createElement("div");badge.className="fxbadge";badge.setAttribute("aria-hidden","true");badge.textContent="ممتاز";document.body.append(badge);
  function glow(kind){fx.className="fxglow";badge.className="fxbadge";void fx.offsetWidth;fx.className="fxglow "+kind;if(kind==="ok"){void badge.offsetWidth;badge.className="fxbadge show"}}
  const ding=()=>{tone(1318,0,.7,"sine",.22);tone(2637,0,.35,"sine",.06)};
  const buzz=()=>{tone(150,0,.28,"square",.07,120)};
  return{
    good(){glow("ok");ding()},
    bad(){glow("no");buzz()},
    win(){glow("ok");ding();setTimeout(()=>tone(1568,0,.8,"sine",.2),220)},
    tick(){tone(880,0,.08,"sine",.1)},
    rumble(d,vol){noise(0,d||2,vol||.5,"lowpass",140,60)},
    boom(){noise(0,2.5,1,"lowpass",900,40);tone(70,0,1.4,"sine",.6,30)},
    bubble(){for(let i=0;i<10;i++)tone(300+Math.random()*500,i*.12+Math.random()*.05,.08,"sine",.07,700+Math.random()*400)},
    hiss(d){noise(0,d||1.5,.15,"highpass",3000)},
    whoosh(){noise(0,.6,.25,"bandpass",400,2400)},
    thud(){tone(110,0,.25,"sine",.35,50)},
  };
})();
</script>
<script>
// Shared helpers for all labs
const $=(s,r=document)=>r.querySelector(s);
const el=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.childElementCount===1?t.content.firstElementChild:t.content};
const shuffle=(a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.append(e);return e}

// Step bar
function setSteps(n,total){const ul=$("#steps");ul.replaceChildren();for(let i=0;i<total;i++){const li=document.createElement("li");if(i<n)li.className="done";else if(i===n)li.className="now";ul.append(li)}}

// Multiple-choice: must reach the right answer to continue. Returns promise resolved on correct.
// opts: [{t:"text", ok:true/false, why:"explanation"}]
function mcq(host,{q,opts,right,doShuffle=true}){
  return new Promise(res=>{
    const box=el(`<div class="opts" role="group"></div>`);
    const fb=el(`<div class="fb" role="status" hidden></div>`);
    if(q)host.append(el(`<p><b>${q}</b></p>`));
    host.append(box,fb);
    const list=doShuffle?shuffle(opts):opts;
    let tries=0;
    list.forEach(o=>{
      const b=el(`<button class="opt" type="button">${o.t}</button>`);
      b.onclick=()=>{
        if(o.ok){
          box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
          b.classList.add("right");fb.hidden=false;fb.className="fb ok";fb.textContent=right||o.why||"إجابة صحيحة.";SFX.good();res(tries)
        }else{
          tries++;b.classList.add("wrong");b.disabled=true;fb.hidden=false;fb.className="fb no";fb.textContent=o.why||"ليست هذه. فكّري مرة أخرى.";SFX.bad()
        }
      };
      box.append(b);
    });
  });
}

// Tap-to-classify: pick a chip then a bin. items:[{t, bin, why}] bins:[{id,label,hint}]
function classify(host,{items,bins,onPick}){
  return new Promise(res=>{
    const chips=el(`<div class="chips" aria-label="البطاقات"></div>`);
    const binsEl=el(`<div class="bins"></div>`);
    const fb=el(`<div class="fb info" role="status">اختاري بطاقة، ثم اختاري المجموعة المناسبة لها.</div>`);
    host.append(chips,binsEl,fb);
    let sel=null,left=items.length;
    const binBtns={};
    bins.forEach(b=>{
      const bb=el(`<button class="bin" type="button"><b>${b.label}</b>${b.hint?`<span class="muted">${b.hint}</span>`:""}<span class="in"></span></button>`);
      bb.onclick=()=>{
        if(!sel){fb.className="fb info";fb.textContent="اختاري بطاقة أولاً.";return}
        const it=sel.item;
        if(it.bin===b.id){
          bb.querySelector(".in").append(el(`<span>${it.t}</span>`));
          sel.btn.classList.add("placed");sel.btn.disabled=true;sel.btn.setAttribute("aria-pressed","false");
          fb.className="fb ok";fb.textContent=it.why||"صحيح.";SFX.good();sel=null;left--;
          Object.values(binBtns).forEach(x=>x.classList.remove("ready"));
          if(left===0)res();
        }else{
          fb.className="fb no";fb.textContent=it.hintWrong||"ليست هذه المجموعة. انظري إلى المادة مرة أخرى.";SFX.bad();
        }
      };
      binBtns[b.id]=bb;binsEl.append(bb);
    });
    shuffle(items).forEach(it=>{
      const c=el(`<button class="chip" type="button" aria-pressed="false">${it.t}</button>`);
      c.onclick=()=>{
        chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
        c.setAttribute("aria-pressed","true");sel={item:it,btn:c};SFX.tick();
        Object.values(binBtns).forEach(x=>x.classList.add("ready"));
        fb.className="fb info";fb.textContent="«"+it.t+"»: إلى أي مجموعة تنتمي؟";
        if(onPick)onPick(it);
      };
      chips.append(c);
    });
  });
}

// Final screen with code
function finish(task,code,learned){
  SFX.win();
  task.classList.add("done-card");
  task.replaceChildren(el(`<div><h2>أنهيتِ المعمل</h2><p>رمز الإنجاز الخاص بهذا المعمل:</p><div class="code">${code}</div><p>عودي إلى النموذج واكتبي هذا الرمز، ثم أجيبي عن السؤال.</p><h2 style="margin-top:12px">ما تعلمتِه</h2><ul class="learned">${learned.map(x=>`<li>${x}</li>`).join("")}</ul></div>`));
  task.scrollIntoView({behavior:"smooth",block:"start"});
}

</script>
<script>
const CODE="6815";
const main=$("#main");
const TOTAL=4;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function makeCanvas(w,h,label){const c=document.createElement("canvas");c.width=w*2;c.height=h*2;c.style.aspectRatio=w+"/"+h;c.style.width="100%";c.setAttribute("role","img");c.setAttribute("aria-label",label);const x=c.getContext("2d");x.scale(2,2);x.direction="ltr";return {c,x,w,h}}
function phColor(p){const stops=[[0,[200,30,40]],[3,[240,110,40]],[5,[240,200,60]],[7,[60,170,80]],[9,[40,120,200]],[11,[70,60,180]],[14,[110,40,140]]];for(let i=1;i<stops.length;i++){if(p<=stops[i][0]){const [a,ca]=stops[i-1],[b,cb]=stops[i];const t=(p-a)/(b-a);return `rgb(${ca.map((v,k)=>Math.round(v+(cb[k]-v)*t)).join(",")})`}}return "rgb(110,40,140)"}

// ================= Stage 1: bases release OH-, strength =================
function stage1(){
  setSteps(0,TOTAL);
  const card=el(`<section class="card"><h2>١. القاعدة في الماء: من أين تأتي قوتها؟</h2>
  <p>في الكأسين كمية متساوية من قاعدتين مختلفتين. أذيبيهما وعُدّي أيونات <b>الهيدروكسيد OH⁻</b> المتكوّنة في كل كأس.</p>
  <div class="stage" id="s1"></div>
  <div class="row"><button class="btn" id="go" type="button">أذيبي القاعدتين في الماء</button></div>
  <div id="s1f"></div></section>`);
  main.append(card);
  const W=360,H=250;const {c,x}=makeCanvas(W,H,"كأسان فيهما قاعدتان مختلفتان");$("#s1",card).append(c);
  const N=6;
  const L=[],Rr=[];
  for(let i=0;i<N;i++){L.push({x:42+(i%3)*48,y:90+Math.floor(i/3)*60,split:0});Rr.push({x:220+(i%3)*45,y:90+Math.floor(i/3)*60,split:0})}
  let cntL=0,cntR=0;
  function unit(u,isNaOH){
    const s=u.split;
    if(isNaOH){
      x.fillStyle="#8e6cd9";x.beginPath();x.arc(u.x-6-s*6,u.y-s*10,8,0,7);x.fill();
      drawOH(u.x+6+s*2,u.y+s*8,s>.5);
      if(s>.5){x.fillStyle="#fff";x.font="700 11px sans-serif";x.textAlign="center";x.fillText("+",u.x-12,u.y-6)}
    }else{
      // NH3: N blue with 3 H; when reacting, takes H from water -> NH4+ and OH-
      x.fillStyle="#4a7bd0";x.beginPath();x.arc(u.x,u.y,9,0,7);x.fill();
      x.fillStyle="#f4f4f4";x.strokeStyle="#666";for(const [a,b] of [[-10,7],[10,7],[0,-11]]){x.beginPath();x.arc(u.x+a,u.y+b,4,0,7);x.fill();x.stroke()}
      if(u.react&&s>.5){drawOH(u.x+22,u.y+18,true)}
    }
  }
  function drawOH(px,py,ion){
    x.fillStyle="#e5484d";x.beginPath();x.arc(px,py,8,0,7);x.fill();
    x.fillStyle="#f4f4f4";x.strokeStyle="#666";x.beginPath();x.arc(px+9,py-5,4,0,7);x.fill();x.stroke();
    if(ion){x.fillStyle=css("--base");x.font="700 11px sans-serif";x.textAlign="center";x.fillText("OH⁻",px+2,py+21)}
  }
  function frame(){
    x.clearRect(0,0,W,H);
    for(const [bx,label,fm] of [[14,"هيدروكسيد الصوديوم","NaOH"],[194,"الأمونيا","NH₃"]]){
      x.fillStyle="rgba(127,184,230,.3)";x.fillRect(bx,50,152,170);x.strokeStyle=css("--ink");x.lineWidth=3;x.strokeRect(bx,40,152,180);
      x.fillStyle=css("--ink");x.font="600 12px "+css("--body");x.textAlign="center";x.direction="rtl";x.fillText(label,bx+76,16);x.direction="ltr";x.font="700 12px sans-serif";x.fillText(fm,bx+76,33);
    }
    L.forEach(u=>unit(u,true));Rr.forEach(u=>unit(u,false));
    x.fillStyle=css("--base");x.font="700 13px "+css("--body");x.textAlign="center";
    x.fillText("OH⁻ : "+cntL,90,243);x.fillText("OH⁻ : "+cntR,270,243);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const go=$("#go",card),f=$("#s1f",card);
  go.onclick=async()=>{
    go.disabled=true;SFX.bubble();
    for(let k=0;k<=20;k++){const s=k/20;L.forEach(u=>u.split=s);if(s>.5&&cntL===0)cntL=N;Rr[1].react=true;Rr[1].split=s;if(s>.5&&cntR===0)cntR=1;await sleep(60)}
    SFX.good();
    f.replaceChildren(el(`<div class="fb info">في كأس <b>هيدروكسيد الصوديوم</b> انفصلت كل الوحدات وأطلقت ${N} أيونات OH⁻، أما في كأس <b>الأمونيا</b> فلم يتكوّن إلا أيون OH⁻ واحد.</div>`));
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px"></div>`);card.append(q);
    await mcq(q,{q:"أي القاعدتين أقوى؟ ولماذا؟",opts:[
      {t:"هيدروكسيد الصوديوم، لأنه ينفصل بسهولة ويطلق أيونات OH⁻ أكثر في الماء",ok:true},
      {t:"الأمونيا، لأن رائحتها أقوى",why:"الرائحة لا تحدد قوة القاعدة؛ المعيار هو عدد أيونات OH⁻ التي تطلقها."},
      {t:"متساويتان لأن الكمية متساوية",why:"الكمية متساوية، لكن عدد أيونات OH⁻ المتكوّنة مختلف."}],right:"صحيح. قوة القاعدة تعتمد على سهولة انفصالها إلى أيونات، أي إطلاقها أيونات الهيدروكسيد OH⁻ في الماء."});
    await mcq(q,{q:"القاعدة مادة تكوّن في الماء أيونات:",opts:[
      {t:"الهيدروكسيد OH⁻",ok:true},{t:"الهيدرونيوم H₃O⁺",why:"هذه أيونات الأحماض."},{t:"الكلوريد Cl⁻",why:"ليست هي المميزة للقواعد."}],right:"صحيح."});
    const n=el(`<button class="btn" type="button">التالي</button>`);q.append(n);n.onclick=()=>{n.remove();stage2()};
  };
}

// ================= Stage 2: litmus first, then pH meter =================
function stage2(){
  setSteps(1,TOTAL);
  const S=[{k:"lemon",t:"عصير الليمون",p:2.2},{k:"vin",t:"الخل",p:2.9},{k:"dw",t:"الماء المقطّر",p:7},{k:"soda",t:"محلول صودا الخبز",p:8.4},{k:"soap",t:"الصابون",p:10},{k:"oven",t:"منظف الأفران",p:13.2}];
  const BLUE="#2b5fd9",RED="#d1344a";
  const type=p=>p<7?"a":p>7?"b":"n";
  const NAME={a:"حمضي",b:"قاعدي",n:"متعادل"};
  const card=el(`<section class="card"><h2>٢. كيف نكشف الحمض والقاعدة؟</h2>
  <p>لكل مادة خطوتان: <b>أولاً</b> اغمسي فيها ورقتي تباع الشمس، الزرقاء والحمراء، وقرّري نوع المادة. <b>ثانياً</b> تأكدي من قرارك بجهاز الرقم الهيدروجيني pH.</p>
  <div class="fb info"><b>قاعدة تباع الشمس:</b>
   <div class="tablebox" style="margin-top:6px"><table style="min-width:300px"><thead><tr><th></th><th>الورقة الزرقاء</th><th>الورقة الحمراء</th></tr></thead><tbody>
   <tr><td><b style="color:var(--acid)">حمض</b></td><td>تتحوّل إلى <b style="color:${RED}">حمراء</b></td><td>تبقى حمراء</td></tr>
   <tr><td><b style="color:var(--base)">قاعدة</b></td><td>تبقى زرقاء</td><td>تتحوّل إلى <b style="color:${BLUE}">زرقاء</b></td></tr>
   <tr><td><b style="color:var(--neutral)">متعادل</b></td><td>تبقى زرقاء</td><td>تبقى حمراء</td></tr></tbody></table></div>
   <span class="muted">المهم: نراقب الورقة التي <b>تغيّر</b> لونها.</span></div>
  <div class="lbl muted">اختاري مادة</div><div class="seg" id="samp"></div>
  <div id="bench"></div>
  <div class="tablebox"><table><thead><tr><th>المادة</th><th>الورقة الزرقاء</th><th>الورقة الحمراء</th><th>نوعها</th><th>pH</th></tr></thead><tbody>${S.map(s=>`<tr data-s="${s.k}"><td>${s.t}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td></tr>`).join("")}</tbody></table></div>
  </section>`);
  main.append(card);card.scrollIntoView({behavior:"smooth",block:"start"});
  const bench=$("#bench",card);const done=new Set();
  bench.append(el(`<p class="muted" style="text-align:center;padding:16px">اختاري مادة لتبدئي</p>`));
  S.forEach(s=>{const b=el(`<button type="button" aria-pressed="false" data-k="${s.k}">${s.t}</button>`);b.onclick=()=>{$("#samp",card).querySelectorAll("button").forEach(z=>z.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");SFX.tick();open(s)};$("#samp",card).append(b)});

  function stripSVG(orig,after,dipped,label){
    const s=sv("svg",{viewBox:"0 0 140 230",role:"img","aria-label":label});
    // beaker
    sv("rect",{x:20,y:150,width:100,height:66,fill:"#cfe3f3",opacity:.8},s);
    sv("path",{d:"M14 130 L20 136 L20 210 Q20 218 28 218 L112 218 Q120 218 120 210 L120 136 L126 130",fill:"none",stroke:"var(--ink)","stroke-width":3},s);
    // strip: top part original, bottom part (dipped) new colour
    sv("rect",{x:56,y:dipped?50:20,width:28,height:150,rx:3,fill:orig,stroke:"#333","stroke-width":1},s);
    if(dipped){sv("rect",{x:56,y:150,width:28,height:50,rx:3,fill:after,stroke:"#333","stroke-width":1},s);
      const changed=after!==orig;
      const t=sv("text",{x:70,y:38,"text-anchor":"middle","font-size":13,"font-weight":700,fill:changed?"var(--warm)":"var(--muted)"},s);t.textContent=changed?"تغيّر اللون!":"لم يتغيّر";}
    return s;
  }
  function open(s){
    bench.replaceChildren();
    const box=el(`<div class="card" style="background:var(--bg)"><h3>${s.t}</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="text-align:center"><b>الورقة الزرقاء</b><div class="stage" data-p="b"></div><div class="res muted" data-p="b">لم تُغمس بعد</div></div>
        <div style="text-align:center"><b>الورقة الحمراء</b><div class="stage" data-p="r"></div><div class="res muted" data-p="r">لم تُغمس بعد</div></div>
      </div>
      <button class="btn" type="button" data-a="dip">اغمسي الورقتين في ${s.t}</button>
      <div data-a="decide"></div><div data-a="ph"></div></div>`);
    bench.append(box);
    const stB=box.querySelector('.stage[data-p="b"]'),stR=box.querySelector('.stage[data-p="r"]');
    stB.append(stripSVG(BLUE,BLUE,false,"ورقة تباع شمس زرقاء"));stR.append(stripSVG(RED,RED,false,"ورقة تباع شمس حمراء"));
    const ty=type(s.p);
    const afterB=ty==="a"?RED:BLUE,afterR=ty==="b"?BLUE:RED;
    box.querySelector('[data-a="dip"]').onclick=(e)=>{
      e.target.remove();SFX.bubble();
      stB.replaceChildren(stripSVG(BLUE,afterB,true,"الورقة الزرقاء بعد الغمس"));stR.replaceChildren(stripSVG(RED,afterR,true,"الورقة الحمراء بعد الغمس"));
      const rb=afterB===BLUE?"بقيت زرقاء":"تحوّلت إلى حمراء",rr=afterR===RED?"بقيت حمراء":"تحوّلت إلى زرقاء";
      box.querySelector('.res[data-p="b"]').innerHTML=`<b>${rb}</b>`;box.querySelector('.res[data-p="r"]').innerHTML=`<b>${rr}</b>`;
      const row=card.querySelector(`tr[data-s="${s.k}"]`).children;row[1].textContent=rb;row[2].textContent=rr;row[1].classList.remove("empty");row[2].classList.remove("empty");
      const d=box.querySelector('[data-a="decide"]');
      d.append(el(`<p><b>بناءً على الورقتين، هذه المادة:</b></p>`));
      const g=el(`<div class="seg"></div>`);d.append(g);const fb=el(`<div class="fb" hidden></div>`);d.append(fb);
      ["a","n","b"].forEach(k=>{const b=el(`<button type="button">${NAME[k]}</button>`);b.onclick=()=>{
        if(k===ty){SFX.good();g.querySelectorAll("button").forEach(z=>z.disabled=true);b.setAttribute("aria-pressed","true");fb.hidden=false;fb.className="fb ok";
          fb.textContent=ty==="a"?"صحيح. الورقة الزرقاء تحوّلت إلى حمراء، فالمادة حمضية.":ty==="b"?"صحيح. الورقة الحمراء تحوّلت إلى زرقاء، فالمادة قاعدية.":"صحيح. لم تتغير أي ورقة، فالمادة متعادلة.";
          row[3].textContent=NAME[ty];row[3].classList.remove("empty");phStep()}
        else{SFX.bad();fb.hidden=false;fb.className="fb no";fb.textContent="انظري إلى الورقة التي تغيّر لونها، وارجعي إلى قاعدة تباع الشمس في الأعلى."}};g.append(b)});
      function phStep(){
        const p=box.querySelector('[data-a="ph"]');
        const b=el(`<button class="btn alt" type="button">تأكدي بجهاز pH</button>`);p.append(b);
        b.onclick=()=>{b.remove();SFX.tick();
          const pct=s.p/14*100;
          p.append(el(`<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px">
            <div style="font-family:var(--display);font-weight:700;font-size:22px;text-align:center" dir="ltr">pH = ${s.p}</div>
            <div style="position:relative;height:26px;border-radius:6px;background:linear-gradient(to right,${[0,2,4,6,7,8,10,12,14].map(v=>phColor(v)+" "+(v/14*100)+"%").join(",")});direction:ltr">
              <div style="position:absolute;left:calc(${pct}% - 2px);top:-6px;width:4px;height:38px;background:var(--ink);border-radius:2px"></div></div>
            <div style="display:flex;justify-content:space-between;direction:ltr;font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums">${Array.from({length:15},(_,i)=>`<span style="width:0;display:flex;justify-content:center">${i}</span>`).join("")}</div>
            <div class="fb info">${s.p<7?"أقل من 7 ← حمضي":s.p>7?"أكبر من 7 ← قاعدي":"يساوي 7 ← متعادل"}، وهذا يطابق ما وجدتِه بتباع الشمس.</div></div>`));
          row[4].textContent=s.p;row[4].classList.remove("empty");
          done.add(s.k);$(`#samp button[data-k="${s.k}"]`,card).classList.add("tried");
          if(done.size===S.length)ask();
          else p.append(el(`<p class="muted">اختاري مادة أخرى من الأعلى. أنجزتِ ${done.size} من ${S.length}.</p>`));
        };
      }
    };
  }
  let asked=false;
  async function ask(){
    if(asked)return;asked=true;
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px"></div>`);card.append(q);q.scrollIntoView({behavior:"smooth",block:"start"});
    await mcq(q,{q:"وجدت هند كأسين فيهما محلولان شفافان. وضعت ورقة تباع الشمس الزرقاء في أحدهما فبقيت زرقاء، فقالت: «هذا هو المحلول الحمضي». هل استنتاجها صحيح؟",opts:[
      {t:"لا؛ لو كان حمضياً لتحوّلت الورقة الزرقاء إلى حمراء. بقاؤها زرقاء يعني أنه ليس حمضياً",ok:true},
      {t:"نعم؛ لأن الورقة لم يتغير لونها",why:"الحمض يغيّر لون الورقة الزرقاء إلى أحمر، كما رأيتِ مع الليمون والخل. عدم التغير يعني أنه ليس حمضاً."},
      {t:"نعم؛ لأن الأحماض لا تؤثر في تباع الشمس",why:"بل تؤثر: حوّلت الورقة الزرقاء إلى حمراء مع الليمون والخل."}],right:"صحيح. استنتاج هند خاطئ."});
    const n=el(`<button class="btn" type="button">التالي</button>`);q.append(n);n.onclick=()=>{n.remove();stage3()};
  }
}

// ================= Stage 3: neutralization =================
function stage3(){
  setSteps(2,TOTAL);
  const card=el(`<section class="card"><h2>٣. التعادل: حمض + قاعدة</h2>
  <p>في الكأس <b>حمض الهيدروكلوريك</b> مع قطرات من كاشف: يكون المحلول <b style="color:var(--acid)">أحمر</b> ما دام حمضياً، ويصبح <b>عديم اللون</b> عند التعادل، ويتحوّل إلى <b style="color:var(--base)">أزرق</b> إذا صار قاعدياً. أضيفي محلول <b>هيدروكسيد الصوديوم</b> قطرةً قطرة، وتوقفي عندما يصبح المحلول <b>متعادلاً</b>.</p>
  <div class="stage" id="s3"></div>
  <div class="row"><button class="btn" id="drop" type="button">أضيفي قطرة قاعدة</button><button class="btn ghost" id="stop" type="button">توقفتُ: المحلول متعادل</button><button class="btn ghost" id="reset" type="button" hidden>أعيدي التجربة</button></div>
  <div id="s3f"></div></section>`);
  main.append(card);card.scrollIntoView({behavior:"smooth",block:"start"});
  const W=360,H=240;const {c,x}=makeCanvas(W,H,"كأس تعادل يتغير لونه");$("#s3",card).append(c);
  const curve=[1,1.2,1.5,1.9,2.5,3.4,7,10.6,11.6,12.2];
  let n=0,ph=curve[0],drops=[];
  function draw(){
    x.clearRect(0,0,W,H);
    // burette
    x.fillStyle="#cfe0ff";x.fillRect(172,0,16,70);x.strokeStyle=css("--ink");x.lineWidth=2;x.strokeRect(172,0,16,70);x.beginPath();x.moveTo(176,70);x.lineTo(180,84);x.lineTo(184,70);x.stroke();
    for(const d of drops){d.y+=4;x.fillStyle="#7aa2ff";x.beginPath();x.arc(180,d.y,3,0,7);x.fill()}drops=drops.filter(d=>d.y<120);
    x.fillStyle=ph<6.8?`rgba(209,52,74,${Math.min(.85,.25+(7-ph)*.11)})`:ph>7.2?"rgba(43,95,217,.75)":"rgba(220,232,240,.5)";x.fillRect(114,120,132,90);
    x.strokeStyle=css("--ink");x.lineWidth=3;x.beginPath();x.moveTo(108,96);x.lineTo(114,102);x.lineTo(114,204);x.quadraticCurveTo(114,212,122,212);x.lineTo(238,212);x.quadraticCurveTo(246,212,246,204);x.lineTo(246,102);x.lineTo(252,96);x.stroke();
    x.fillStyle=css("--ink");x.font="700 18px sans-serif";x.textAlign="center";x.fillText("pH = "+ph.toFixed(1),300,150);
    x.font="500 12px "+css("--body");x.direction="rtl";x.fillText("القطرات: "+n,60,150);x.direction="ltr";
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
  const f=$("#s3f",card),dropB=$("#drop",card),stopB=$("#stop",card),reset=$("#reset",card);
  dropB.onclick=()=>{if(n>=curve.length-1)return;n++;drops.push({y:84});setTimeout(()=>{ph=curve[n];SFX.tick();if(ph>7.5){f.replaceChildren(el(`<div class="fb no">تجاوزتِ نقطة التعادل! صار المحلول قاعدياً فتحوّل لونه إلى الأزرق. أعيدي التجربة وأضيفي القطرات بحذر.</div>`));dropB.disabled=true;stopB.disabled=true;reset.hidden=false;SFX.bad()}else f.replaceChildren()},400)};
  reset.onclick=()=>{n=0;ph=curve[0];dropB.disabled=false;stopB.disabled=false;reset.hidden=true;f.replaceChildren()};
  stopB.onclick=async()=>{
    if(Math.abs(ph-7)>.2){SFX.bad();f.replaceChildren(el(`<div class="fb no">ليس بعد. pH = ${ph.toFixed(1)}، والمحلول ما زال حمضياً. المتعادل قيمته 7.</div>`));return}
    dropB.disabled=true;stopB.disabled=true;SFX.good();
    f.replaceChildren(el(`<div class="fb ok">أحسنتِ! pH = 7 والمحلول عديم اللون: تعادل الحمض مع القاعدة.</div>`),el(`<div class="fb info" style="margin-top:8px;text-align:center;font-size:17px"><b>حمض + قاعدة ← ملح + ماء</b><br><span dir="ltr">HCl + NaOH → NaCl + H₂O</span></div>`));
    const q=el(`<div style="display:flex;flex-direction:column;gap:10px;margin-top:6px"></div>`);card.append(q);
    await mcq(q,{q:"تشعر سلمى بحرقة في معدتها بسبب زيادة الحمض، فتناولت حبة مضاد للحموضة (مادة قاعدية). كيف تساعدها؟",opts:[
      {t:"تتفاعل القاعدة مع حمض المعدة الزائد فتعادله",ok:true},{t:"تزيد حمض المعدة",why:"القاعدة لا تزيد الحمض، بل تتفاعل معه."},{t:"تحوّل المعدة إلى وسط قاعدي قوي",why:"الهدف التعادل فقط، لا جعل المعدة قاعدية."}],right:"صحيح. هذا تطبيق للتعادل في حياتنا."});
    setSteps(3,TOTAL);
    const b=el(`<button class="btn alt" type="button">احصلي على رمز الإنجاز</button>`);q.append(b);
    b.onclick=()=>{setSteps(TOTAL,TOTAL);b.remove();const t=el(`<section class="card"></section>`);main.append(t);finish(t,CODE,[
      "القاعدة مادة تكوّن أيونات الهيدروكسيد OH⁻ في الماء.",
      "قوة القاعدة تعتمد على سهولة انفصالها إلى أيونات، أي إطلاقها أيونات OH⁻.",
      "الرقم الهيدروجيني: أقل من 7 حمضي، 7 متعادل، أكبر من 7 قاعدي.",
      "الحمض يحوّل تباع الشمس الأزرق إلى أحمر، والقاعدة تحوّل الأحمر إلى أزرق.",
      "حمض + قاعدة ← ملح + ماء، وهذا هو التعادل."])};
  };
}

main.append(el(`<section class="card"><p>في هذا المعمل تكتشفين سر قوة القاعدة، وتقيسين الرقم الهيدروجيني لمواد من بيتك، ثم تجرين تفاعل التعادل بنفسك.</p></section>`));
stage1();
window.__labstep=async()=>{
  const go=document.getElementById("go");if(go&&!go.disabled){go.click();await sleep(2000);return true}
  const samp=[...document.querySelectorAll("#samp button")];
  const nxt=samp.find(b=>!b.classList.contains("tried"));
  if(nxt){nxt.click();await sleep(50);document.querySelector('[data-a="dip"]').click();await sleep(50);for(const b of document.querySelectorAll('[data-a="decide"] .seg button')){if(!b.disabled)b.click();await sleep(20)}await sleep(50);[...document.querySelectorAll('[data-a="ph"] .btn')].forEach(b=>b.click());await sleep(80);return true}
  const d=document.getElementById("drop");if(d&&!d.disabled){for(let i=0;i<6;i++){d.click();await sleep(450)}document.getElementById("stop").click();await sleep(300);return true}
  return false;
};

</script>
